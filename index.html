<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISO Studio | Enlaces</title>
<link rel="icon" type="image/png" href="isologotransparente.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0a09;
    --bg-soft:#141210;
    --card:#17140f;
    --card-hover:#1e1a14;
    --cream:#f3eee7;
    --muted:#a89f92;
    --rose:#c99a8e;
    --gold:#a97c50;
    --line:rgba(243,238,231,0.09);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, rgba(169,124,80,0.10), transparent 55%),
      radial-gradient(ellipse at 50% 110%, rgba(201,154,142,0.08), transparent 55%),
      var(--bg);
    min-height:100vh;
    font-family:'Jost', sans-serif;
    color:var(--cream);
    display:flex;
    justify-content:center;
    padding:64px 20px 40px;
  }
  .page{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .avatar-wrap{
    position:relative;
    width:104px;
    height:104px;
    margin-bottom:22px;
  }
  .avatar-ring{
    position:absolute;
    inset:-4px;
    border-radius:50%;
    background:conic-gradient(from 180deg, var(--gold), var(--rose), var(--gold));
    opacity:0.55;
    animation:spin 10s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .avatar-ring{animation:none;}
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .avatar{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:var(--bg-soft) url('https://iso-project.vercel.app/images/logo_white.png') center/55% no-repeat;
    border:3px solid var(--bg);
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:28px;
    letter-spacing:0.14em;
    margin:0 0 6px;
    text-transform:uppercase;
  }
  .tagline{
    font-size:13px;
    letter-spacing:0.04em;
    color:var(--muted);
    margin:0 0 22px;
    line-height:1.5;
  }
  .divider{
    width:46px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    margin-bottom:28px;
  }
  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:13px;
  }
  .link-card{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:16px 20px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    color:var(--cream);
    text-decoration:none;
    font-size:14.5px;
    letter-spacing:0.03em;
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .link-card:hover, .link-card:focus-visible{
    transform:translateY(-2px);
    border-color:var(--rose);
    background:var(--card-hover);
    outline:none;
  }
  .link-card .icon{
    width:16px;
    height:16px;
    flex-shrink:0;
    opacity:0.85;
  }
  .link-card.featured{
    border-color:var(--gold);
    background:linear-gradient(180deg, rgba(169,124,80,0.14), rgba(201,154,142,0.06));
  }
  .socials{
    display:flex;
    gap:22px;
    margin-top:32px;
  }
  .socials a{
    color:var(--muted);
    opacity:0.8;
    transition:opacity .18s ease, color .18s ease;
  }
  .socials a:hover{
    color:var(--rose);
    opacity:1;
  }
  .socials svg{width:18px;height:18px;}
  footer{
    margin-top:34px;
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--muted);
    opacity:0.65;
  }
</style>
</head>
<body>
  <main class="page">
    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <div class="avatar" role="img" aria-label="Logo ISO Studio"></div>
    </div>

    <h1>Iso Studio</h1>
    <p class="tagline">Dirección Creativa &amp; Fotografía Boutique<br>Santo Domingo, RD</p>
    <div class="divider"></div>

    <nav class="links">
      <a class="link-card featured" href="https://iso-project.vercel.app/#planes" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18l6-6-6-6"/></svg>
        Reservar mi sesión
      </a>
      <a class="link-card" href="https://iso-project.vercel.app/" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/></svg>
        Sitio web
      </a>
      <a class="link-card" href="https://iso-project.vercel.app/#portafolio" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Portafolio
      </a>
      <a class="link-card" href="https://wa.me/18494832728" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 11.5a8.5 8.5 0 1 1-3.6-6.9L21 3l-1.2 3.9a8.4 8.4 0 0 1 1.2 4.6z"/></svg>
        WhatsApp directo
      </a>
      <a class="link-card" href="https://instagram.com/Iso_estudios" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="0.6" fill="currentColor"/></svg>
        Instagram
      </a>
    </nav>

    <div class="socials">
      <a href="https://instagram.com/Iso_estudios" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></svg>
      </a>
      <a href="https://pinterest.com" target="_blank" rel="noopener" aria-label="Pinterest">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M9 17c1-3 1.5-6 2.2-9M12 8a3 3 0 1 1 0 6c-1 0-1.6-.3-2-.7"/></svg>
      </a>
      <a href="https://tiktok.com" target="_blank" rel="noopener" aria-label="TikTok">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 3v11a3.5 3.5 0 1 1-3-3.46"/><path d="M14 3c.5 2.2 2 3.7 4 4v2c-1.5 0-3-.5-4-1.3"/></svg>
      </a>
      <a href="https://youtube.com" target="_blank" rel="noopener" aria-label="YouTube">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M11 10l4 2-4 2z" fill="currentColor" stroke="none"/></svg>
      </a>
    </div>

    <footer>© 2026 ISO STUDIO &middot; Hecho en RD 🇩🇴</footer>
  </main>
</body>
</html>
